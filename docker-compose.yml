services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: niulai
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 校验库已建好，避免后端先连上时数据库还没初始化完
      test: ["CMD-SHELL", "mysql -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'USE niulai' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 当前没有独立的 SQL 迁移脚本，非 release 模式由 GORM 自动建表（幂等）。
      # 补齐正式迁移脚本后，把 .env 里的 APP_SERVER_MODE 改成 release。
      APP_SERVER_MODE: "${APP_SERVER_MODE:-debug}"
      APP_MYSQL_HOST: mysql
      APP_MYSQL_PORT: "3306"
      APP_MYSQL_USERNAME: root
      APP_MYSQL_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}"
      APP_MYSQL_DATABASE: niulai
      APP_JWT_SECRET: "${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}"
      TZ: Asia/Shanghai
    # 只暴露给 web 反代，不对宿主机开放
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build: ./client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  mysql-data:
