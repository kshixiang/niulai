services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: niulai
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅在数据卷首次初始化时执行，表结构由 SQL 显式管理
      - ./server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 校验库已建好，避免后端先连上时数据库还没初始化完
      test: ["CMD-SHELL", "mysql -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'USE niulai' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 表结构由 server/migrations/001_init.sql 显式管理，生产关闭 GORM 自动迁移
      APP_SERVER_MODE: "${APP_SERVER_MODE:-release}"
      APP_MYSQL_HOST: mysql
      APP_MYSQL_PORT: "3306"
      APP_MYSQL_USERNAME: root
      APP_MYSQL_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}"
      APP_MYSQL_DATABASE: niulai
      APP_JWT_SECRET: "${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}"
      TZ: Asia/Shanghai
    # 只暴露给 web 反代，不对宿主机开放
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build: ./client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

  admin-web:
    build: ./niulai-admin
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${ADMIN_WEB_PORT:-1009}:80"

volumes:
  mysql-data:
